# Render Blueprint: un servicio web Node.
# Plan gratuito: sin disco persistente, así que las reservas y los cambios del panel se pierden
# en cada reinicio o nueva publicación. Para conservarlos: plan starter + disco
# (descomenta el bloque «disk» y FILO_DATA_DIR=/var/data).
services:
  - type: web
    name: filo-barberia
    runtime: node
    plan: free
    buildCommand: "true"     # sin dependencias que instalar
    startCommand: node server/server.mjs
    healthCheckPath: /api/public-config
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: FILO_SECURE_COOKIE
        value: "1"
      - key: FILO_TRUST_PROXY
        value: "1"
      - key: FILO_ADMIN_PASSWORD
        generateValue: true  # Render crea una contraseña segura; se consulta en Environment
    # disk:
    #   name: filo-data
    #   mountPath: /var/data
    #   sizeGB: 1
