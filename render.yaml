# Render Blueprint: un servicio web Node con un disco persistente para la base de datos.
services:
  - type: web
    name: filo-barberia
    runtime: node
    plan: starter            # el disco persistente requiere un plan de pago
    buildCommand: "true"     # sin dependencias que instalar
    startCommand: node server/server.mjs
    healthCheckPath: /api/public-config
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: FILO_DATA_DIR
        value: /var/data
      - key: FILO_SECURE_COOKIE
        value: "1"
      - key: FILO_TRUST_PROXY
        value: "1"
      - key: FILO_ADMIN_PASSWORD
        generateValue: true  # Render crea una contraseña segura; se consulta en Environment
    disk:
      name: filo-data
      mountPath: /var/data
      sizeGB: 1
